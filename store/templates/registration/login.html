{% extends 'registration/base.html' %}
{% load static %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  body {
    background: #f0f2f5;
    font-family: 'Segoe UI', sans-serif;
  }

  .login-wrapper {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .login-card {
    background-color: white;
    padding: 2.5rem;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 400px;
  }

  .login-title {
    font-size: 1.75rem;
    font-weight: 600;
    margin-bottom: 1.5rem;
    text-align: center;
    color: #333;
  }

  .btn-primary {
    background-color: #4f46e5;
    border: none;
    border-radius: 50px;
    padding: 0.6rem 1.2rem;
    font-weight: 600;
    transition: background-color 0.3s ease;
  }

  .btn-primary:hover {
    background-color: #4338ca;
  }
</style>

<div class="login-wrapper">
  <div class="login-card">
    <h2 class="login-title">🔐 Login to your account</h2>
    <form method="post" action="">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="d-grid mt-3">
        <input type="submit" name="btnsub" value="Login" class="btn btn-primary">
      </div>
    </form>
    {% load socialaccount %}
<a href="{% provider_login_url 'google' %}" class="btn btn-warning" >Login with Google</a>
<a href="{% provider_login_url 'facebook' %}" class="btn btn-info" >Login with Facebook</a>
  </div>
</div>
{% endblock %}
